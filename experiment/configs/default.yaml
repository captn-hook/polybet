version: v1

experiment:
  id: exp-random
  name: random-default
  mode: paper
  tags:
    - random
    - default

model:
  family: random_baseline
  task: binary_yes_no
  params:
    seed: 1337

data:
  signal_topics:
    - signals.normalized.v1
  lookback_minutes: 60
  label_horizon_minutes: 5
  train_window_days: 0
  validation_window_days: 0

features:
  text_embedding:
    enabled: false
    provider: ollama
    model: nomic-embed-text
  numeric: []

inference:
  min_confidence: 0.5
  max_positions: 1
  cooldown_seconds: 30

outputs:
  prediction_topic: predictions.proposed.v1
  include_feature_snapshot: false

random_baseline:
  # Market eligibility/horizon is manager-defined via is_eligible.
  horizon_minutes: 5
  loop_interval_seconds: 30
  seeds: [21, 67, 420]

