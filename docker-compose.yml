name: polybet

x-worker-common: &worker-common
  restart: unless-stopped
  depends_on:
    observe:
      condition: service_started
    nats:
      condition: service_healthy
  environment: &worker-env
    APP_ENV: ${APP_ENV:-dev}
    MANAGER_BASE_URL: http://observe:8080
    NATS_URL: nats://nats:4222
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    VECTOR_BACKEND: pgvector
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - polybet_net

x-signal-base: &signal-base
  <<: *worker-common
  image: ${SIGNAL_IMAGE:-polybet-signal:local}
  build:
    context: .
    dockerfile: .\signal\Dockerfile
  environment:
    <<: *worker-env
    SIGNAL_KIND: ${SIGNAL_KIND:-market_implied}
    SIGNAL_ID: ${SIGNAL_ID:-signal-market-implied}
    SIGNAL_POLL_INTERVAL_SEC: ${SIGNAL_POLL_INTERVAL_SEC:-15}
    SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polybet}
      POSTGRES_USER: ${POSTGRES_USER:-polybet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polybet_dev_password}
      INPUT_DB_USER: ${INPUT_DB_USER:-polybet_input}
      INPUT_DB_PASSWORD: ${INPUT_DB_PASSWORD:-polybet_input_dev_password}
      RESOLUTION_DB_USER: ${RESOLUTION_DB_USER:-polybet_resolution}
      RESOLUTION_DB_PASSWORD: ${RESOLUTION_DB_PASSWORD:-polybet_resolution_dev_password}
      OBSERVE_DB_USER: ${OBSERVE_DB_USER:-polybet_observe}
      OBSERVE_DB_PASSWORD: ${OBSERVE_DB_PASSWORD:-polybet_observe_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-.\data\postgres}:/var/lib/postgresql/data
      - .\postgres\init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polybet} -d ${POSTGRES_DB:-polybet}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - polybet_net

  postgres_backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-polybet_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-polybet}
      POSTGRES_USER: ${POSTGRES_USER:-polybet}
      BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${POSTGRES_BACKUP_PATH:-.\data\backups\postgres}:/backups
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /backups
        while true; do
          until pg_isready -h "$${POSTGRES_HOST}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" >/dev/null 2>&1; do
            sleep 2
          done
          TS=$$(date -u +%Y%m%dT%H%M%SZ)
          FILE="/backups/$${POSTGRES_DB}_$${TS}.sql.gz"
          TMP="$${FILE}.tmp"
          pg_dump -h "$${POSTGRES_HOST}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" | gzip > "$${TMP}"
          mv "$${TMP}" "$${FILE}"
          find /backups -type f -name "*.sql.gz" -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    networks:
      - polybet_net

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - polybet_net

  input:
    image: ${MANAGER_INPUT_IMAGE:-polybet-manager-input:local}
    build:
      context: .\manager
      dockerfile: Dockerfile.input
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${INPUT_PORT:-8001}:8080"
    environment:
      RUST_LOG: ${MANAGER_LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-dev}
      GAMMA_API_BASE: ${GAMMA_API_BASE:-https://gamma-api.polymarket.com}
      DATA_API_BASE: ${DATA_API_BASE:-https://data-api.polymarket.com}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-120}
      TOP_MARKETS_LIMIT: ${TOP_MARKETS_LIMIT:-100}
      TOP_EVENTS_LIMIT: ${TOP_EVENTS_LIMIT:-100}
      MARKET_MAX_MINUTES_TO_END: ${MARKET_MAX_MINUTES_TO_END:-10}
      ZERO_ELIGIBLE_FAIL_STREAK: ${ZERO_ELIGIBLE_FAIL_STREAK:-0}
      DATABASE_URL: postgresql://${INPUT_DB_USER:-polybet_input}:${INPUT_DB_PASSWORD:-polybet_input_dev_password}@postgres:5432/${POSTGRES_DB:-polybet}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://${POSTGRES_USER:-polybet}:${POSTGRES_PASSWORD:-polybet_dev_password}@postgres:5432/${POSTGRES_DB:-polybet}}
      NATS_URL: nats://nats:4222
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ENABLE_PAPER_TRADING: ${ENABLE_PAPER_TRADING:-true}
      LAUNCHER_MANIFEST_PATH: ${LAUNCHER_MANIFEST_PATH:-/app/experiment-launcher/manifest.yaml}
      LAUNCHER_DOCKER_BASE: ${LAUNCHER_DOCKER_BASE:-http://host.docker.internal:2375}
      LAUNCHER_EXPERIMENT_IMAGE: ${LAUNCHER_EXPERIMENT_IMAGE:-polybet-experiment:local}
      LAUNCHER_EXPERIMENT_CONFIG_BIND: ${LAUNCHER_EXPERIMENT_CONFIG_BIND:-G:\polybet\experiment\configs:/app/configs:ro}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .\manager\experiment-launcher:/app/experiment-launcher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - polybet_net

  resolution:
    image: ${MANAGER_RESOLUTION_IMAGE:-polybet-manager-resolution:local}
    build:
      context: .\manager
      dockerfile: Dockerfile.resolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${RESOLUTION_PORT:-8002}:8080"
    environment:
      RUST_LOG: ${MANAGER_LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-dev}
      GAMMA_API_BASE: ${GAMMA_API_BASE:-https://gamma-api.polymarket.com}
      DATA_API_BASE: ${DATA_API_BASE:-https://data-api.polymarket.com}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-120}
      TOP_MARKETS_LIMIT: ${TOP_MARKETS_LIMIT:-100}
      TOP_EVENTS_LIMIT: ${TOP_EVENTS_LIMIT:-100}
      MARKET_MAX_MINUTES_TO_END: ${MARKET_MAX_MINUTES_TO_END:-10}
      ZERO_ELIGIBLE_FAIL_STREAK: ${ZERO_ELIGIBLE_FAIL_STREAK:-0}
      DATABASE_URL: postgresql://${RESOLUTION_DB_USER:-polybet_resolution}:${RESOLUTION_DB_PASSWORD:-polybet_resolution_dev_password}@postgres:5432/${POSTGRES_DB:-polybet}
      NATS_URL: nats://nats:4222
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ENABLE_PAPER_TRADING: ${ENABLE_PAPER_TRADING:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - polybet_net

  observe:
    image: ${MANAGER_OBSERVE_IMAGE:-polybet-manager-observe:local}
    build:
      context: .\manager
      dockerfile: Dockerfile.observe
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${MANAGER_PORT:-8000}:8080"
    environment:
      RUST_LOG: ${MANAGER_LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-dev}
      GAMMA_API_BASE: ${GAMMA_API_BASE:-https://gamma-api.polymarket.com}
      DATA_API_BASE: ${DATA_API_BASE:-https://data-api.polymarket.com}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-120}
      TOP_MARKETS_LIMIT: ${TOP_MARKETS_LIMIT:-100}
      TOP_EVENTS_LIMIT: ${TOP_EVENTS_LIMIT:-100}
      MARKET_MAX_MINUTES_TO_END: ${MARKET_MAX_MINUTES_TO_END:-10}
      ZERO_ELIGIBLE_FAIL_STREAK: ${ZERO_ELIGIBLE_FAIL_STREAK:-0}
      DATABASE_URL: postgresql://${OBSERVE_DB_USER:-polybet_observe}:${OBSERVE_DB_PASSWORD:-polybet_observe_dev_password}@postgres:5432/${POSTGRES_DB:-polybet}
      NATS_URL: nats://nats:4222
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ENABLE_PAPER_TRADING: ${ENABLE_PAPER_TRADING:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - polybet_net

  signal_question_embedding:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: question_embedding
      SIGNAL_ID: signal-question-embedding
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${MARKET_NEW_QUESTION_TOPIC:-market.new_question.v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      DATABASE_URL: postgresql://${OBSERVE_DB_USER:-polybet_observe}:${OBSERVE_DB_PASSWORD:-polybet_observe_dev_password}@postgres:5432/${POSTGRES_DB:-polybet}
    command: ["python", "question_embedding.py"]

  signal_market_implied:
    <<: *signal-base
    command: ["python", "market_implied.py"]

  signal_question:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: ${QUESTION_SIGNAL_KIND:-question}
      SIGNAL_ID: ${QUESTION_SIGNAL_ID:-signal-question}
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${MARKET_NEW_QUESTION_TOPIC:-market.new_question.v1}
    command: ["python", "question.py"]

  signal_outcome_labels:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: ${OUTCOME_LABELS_SIGNAL_KIND:-outcome_labels}
      SIGNAL_ID: ${OUTCOME_LABELS_SIGNAL_ID:-signal-outcome-labels}
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${MARKET_NEW_QUESTION_TOPIC:-market.new_question.v1}
    command: ["python", "outcome_labels.py"]

  signal_market_metadata:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: ${MARKET_METADATA_SIGNAL_KIND:-market_metadata}
      SIGNAL_ID: ${MARKET_METADATA_SIGNAL_ID:-signal-market-metadata}
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${MARKET_NEW_QUESTION_TOPIC:-market.new_question.v1}
    command: ["python", "market_metadata.py"]

  signal_clob_microstructure:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: ${CLOB_MICROSTRUCTURE_SIGNAL_KIND:-clob_microstructure}
      SIGNAL_ID: ${CLOB_MICROSTRUCTURE_SIGNAL_ID:-signal-clob-microstructure}
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${MARKET_NEW_QUESTION_TOPIC:-market.new_question.v1}
      CLOB_API_BASE: ${CLOB_API_BASE:-https://clob.polymarket.com}
    command: ["python", "clob_microstructure.py"]

  signal_open_interest:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: ${OPEN_INTEREST_SIGNAL_KIND:-open_interest}
      SIGNAL_ID: ${OPEN_INTEREST_SIGNAL_ID:-signal-open-interest}
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${MARKET_NEW_QUESTION_TOPIC:-market.new_question.v1}
      DATA_API_BASE: ${DATA_API_BASE:-https://data-api.polymarket.com}
    command: ["python", "open_interest.py"]

  signal_orderbook_depth:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: ${ORDERBOOK_DEPTH_SIGNAL_KIND:-orderbook_depth}
      SIGNAL_ID: ${ORDERBOOK_DEPTH_SIGNAL_ID:-signal-orderbook-depth}
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${MARKET_NEW_QUESTION_TOPIC:-market.new_question.v1}
      CLOB_API_BASE: ${CLOB_API_BASE:-https://clob.polymarket.com}
    command: ["python", "orderbook_depth.py"]

  signal_orderbook_depth_derived:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: ${ORDERBOOK_DEPTH_DERIVED_SIGNAL_KIND:-orderbook_depth_derived}
      SIGNAL_ID: ${ORDERBOOK_DEPTH_DERIVED_SIGNAL_ID:-signal-orderbook-depth-derived}
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}.orderbook_depth
    command: ["python", "orderbook_depth_derived.py"]

  signal_price_history:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: ${PRICE_HISTORY_SIGNAL_KIND:-price_history}
      SIGNAL_ID: ${PRICE_HISTORY_SIGNAL_ID:-signal-price-history}
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${MARKET_NEW_QUESTION_TOPIC:-market.new_question.v1}
      CLOB_API_BASE: ${CLOB_API_BASE:-https://clob.polymarket.com}
    command: ["python", "price_history.py"]

  signal_price_history_derived:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: ${PRICE_HISTORY_DERIVED_SIGNAL_KIND:-price_history_derived}
      SIGNAL_ID: ${PRICE_HISTORY_DERIVED_SIGNAL_ID:-signal-price-history-derived}
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}.price_history
    command: ["python", "price_history_derived.py"]

  signal_trade_flow:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: ${TRADE_FLOW_SIGNAL_KIND:-trade_flow}
      SIGNAL_ID: ${TRADE_FLOW_SIGNAL_ID:-signal-trade-flow}
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${MARKET_NEW_QUESTION_TOPIC:-market.new_question.v1}
      DATA_API_BASE: ${DATA_API_BASE:-https://data-api.polymarket.com}
    command: ["python", "trade_flow.py"]

  signal_trade_flow_derived:
    <<: *signal-base
    environment:
      <<: *worker-env
      SIGNAL_KIND: ${TRADE_FLOW_DERIVED_SIGNAL_KIND:-trade_flow_derived}
      SIGNAL_ID: ${TRADE_FLOW_DERIVED_SIGNAL_ID:-signal-trade-flow-derived}
      SIGNAL_OUTPUT_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}
      MARKET_NEW_QUESTION_TOPIC: ${SIGNAL_OUTPUT_TOPIC:-signal.computed.v1}.trade_flow
    command: ["python", "trade_flow_derived.py"]

networks:
  polybet_net:
    name: ${DOCKER_NETWORK_NAME:-polybet_net}

volumes:
  nats_data:
    name: ${NATS_VOLUME_NAME:-polybet_nats_data}
